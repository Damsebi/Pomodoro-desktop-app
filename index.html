<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>뽀모도로 타이머</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-phase="focus" data-status="idle">
  <main class="app">
    <section class="card timer" aria-label="타이머">
      <button id="settings-btn" class="btn btn-settings" type="button" aria-expanded="false">설정</button>
      <p id="phase" class="phase">집중</p>
      <p id="round" class="round">집중 1/4회</p>
      <div id="time" class="time" role="timer" aria-live="off">25:00</div>
      <div class="progress" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>
      <div class="controls">
        <button id="toggle-btn" class="btn btn-primary" type="button">시작</button>
        <button id="skip-btn" class="btn" type="button">건너뛰기</button>
        <button id="reset-btn" class="btn" type="button">초기화</button>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
